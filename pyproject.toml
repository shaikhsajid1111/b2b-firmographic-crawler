[project]
name = "b2b-firmographic-crawler"
version = "0.1.0"
description = "A web crawler for collecting B2B firmographic data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sajid Shaikh", email = "shaikhsajid11112000@gmail.com" },
]
keywords = ["crawler", "web-crawler", "scraping", "b2b", "firmographic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/shaikhsajid1111/b2b-firmographic-crawler"
Repository = "https://github.com/shaikhsajid1111/b2b-firmographic-crawler"
Issues = "https://github.com/shaikhsajid1111/b2b-firmographic-crawler/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/b2b_firmographic_crawler"]
